<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word to PDF | PDFinity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .workspace { display: flex; min-height: calc(100vh - 80px); }
        .main-content { flex: 1; padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .sidebar { width: 350px; background: var(--glass-bg); backdrop-filter: blur(40px); border-left: 1px solid var(--border-color); padding: 2rem; display: flex; flex-direction: column; z-index: 10; }
        .doc-preview { max-width: 600px; width: 100%; border-radius: 1rem; padding: 2rem; background: white; color: black; box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow-y: auto; max-height: 500px; border: 1px solid var(--border-color); }
        @media (max-width: 992px) { .workspace { flex-direction: column; } .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border-color); } }
    </style>
</head>
<body>

    <div class="bg-mesh">
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>
        <div class="bg-blob blob-3"></div>
    </div>

    <nav class="navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-shapes me-2"></i>PDFinity
            </a>
            <div class="d-flex align-items-center">
                <div class="d-none d-md-flex align-items-center me-4">
                    <a href="index.html" class="nav-link-custom">Home</a>
                </div>
                <div class="theme-switch" id="theme-toggle-btn" title="Toggle Theme">
                    <div class="theme-switch-thumb">
                        <i class="fas fa-sun" id="theme-icon"></i>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="workspace">
        <main class="main-content">
            <div id="initial-drop-zone" class="w-100 d-flex align-items-center justify-content-center">
                <div id="drop-zone" class="drop-zone w-100 shadow-sm border-0" style="max-width: 800px;">
                    <input type="file" id="file-input" accept=".doc,.docx" class="d-none">
                    <div class="mb-4 bg-opacity-10 p-5 rounded-circle d-inline-block" style="background-color: rgba(59, 130, 246, 0.1);">
                        <i class="fas fa-file-export fa-4x" style="color: #3b82f6;"></i>
                    </div>
                    <h2 class="fw-bold">Word to PDF</h2>
                    <p class="text-muted lead">Convert your Word documents (DOCX) into high-quality PDF files.</p>
                    <button class="btn btn-primary btn-lg rounded-pill px-5 py-3 mt-3">Select Word file</button>
                </div>
            </div>

            <div id="preview-container" class="preview-container d-none animate-up w-100 d-flex flex-column align-items-center">
                <div id="doc-preview" class="doc-preview mb-4">
                    <!-- Document content preview will be here -->
                </div>
                <div class="text-center">
                    <h4 id="file-name-display" class="fw-bold mb-1">filename.docx</h4>
                    <p id="file-size-display" class="text-muted small">1.2 MB</p>
                </div>
            </div>
        </main>

        <aside id="sidebar" class="sidebar d-none">
            <div class="mb-5">
                <h4 class="fw-bold mb-1">Conversion Options</h4>
                <p class="text-muted small">Convert your document while preserving structure.</p>
            </div>

            <div class="mb-auto">
                <div class="card p-3 border-0 bg-opacity-10 bg-primary mb-4">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-info-circle text-primary me-3"></i>
                        <small class="text-muted">This tool converts DOCX files to PDF directly in your browser.</small>
                    </div>
                </div>
            </div>

            <div id="action-container" class="mt-4">
                <div class="progress-container mb-4">
                    <div id="conv-progress" class="progress-bar"></div>
                </div>
                <button id="convert-btn" class="btn btn-primary btn-lg w-100 rounded-pill py-3 shadow-lg">
                    <i class="fas fa-file-pdf me-2"></i> Convert to PDF
                </button>
                <button id="change-file" class="btn btn-link btn-sm w-100 mt-3 text-muted text-decoration-none">Change Word file</button>
            </div>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Mammoth.js for Word to HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- jsPDF for HTML to PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="utils.js"></script>
    <script src="word-to-pdf.js"></script>
</body>
</html>
